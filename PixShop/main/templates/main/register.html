{% extends 'main/base.html' %}
{% load static %}

{% block title %}Регистрация — PixShop{% endblock %}

{% block breadcrumbs %}
<a href="{% url 'item_list' %}">Главная</a> → Регистрация
{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <h1>РЕГИСТРАЦИЯ</h1>
    <form method="post" style="margin-top: 30px;">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-add" style="margin-top: 20px;">ЗАРЕГИСТРИРОВАТЬСЯ</button>
    </form>
    <p style="margin-top: 20px; font-size: 0.6rem;">Уже есть аккаунт? <a href="{% url 'login' %}" style="color: white;">Войти</a></p>
</div>
{% endblock %}
